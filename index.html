<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Excel Comparison Tool - High-Precision Reconciliation</title>

  <!-- Google Fonts: Roboto & Material Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />

  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
    }

    body {
      margin: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Modern Custom High-Contrast Diff Highlighting */
    .diff-cell-a {
      background-color: #fee2e2 !important;
      color: #991b1b !important;
      font-weight: 600;
      border-left: 3px solid #dc2626 !important;
    }
    .diff-cell-b {
      background-color: #dcfce7 !important;
      color: #14532d !important;
      font-weight: 600;
      border-left: 3px solid #16a34a !important;
    }

    /* Sticky Table Headers and Columns */
    .sticky-top {
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .sticky-left {
      position: sticky;
      left: 0;
      z-index: 5;
    }

    /* Smooth Nav Pills & Card Hover Effects */
    .nav-pills .nav-link {
      color: #475569;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 14px;
      transition: all 0.15s ease-in-out;
    }
    .nav-pills .nav-link:hover:not(.disabled) {
      background-color: #f1f5f9;
      color: #1e293b;
    }
    .nav-pills .nav-link.active {
      background-color: #2563eb !important;
      color: #ffffff !important;
      box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.25);
    }

    .card {
      border-radius: 10px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    /* Select2-Style Searchable Dropdowns */
    .select2-container {
      position: relative;
      width: 100%;
    }
    .select2-selection {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      min-height: 38px;
      transition: all 0.15s ease;
    }
    .select2-selection:hover {
      border-color: #2563eb;
    }
    .select2-selection.open, .select2-selection:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      outline: none;
    }
    .select2-dropdown-menu {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      min-width: 260px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      z-index: 1050;
      overflow: hidden;
      animation: select2Fade 0.12s ease-out;
    }
    @keyframes select2Fade {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Loading Fallback */
    #root:empty::before {
      content: "Initializing React, Material UI and Bootstrap...";
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 80vh;
      font-size: 16px;
      color: #64748b;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <!-- React Mount Root -->
  <div id="root"></div>

  <!-- Local SheetJS Vendor with CDN fallback -->
  <script src="src/vendor/xlsx.full.min.js"></script>
  <script>
    if (typeof XLSX === 'undefined') {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"><\/script>');
    }
  </script>

  <!-- React 18 & ReactDOM 18 -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Emotion (Required for Material UI) -->
  <script src="https://unpkg.com/@emotion/react@11/dist/emotion-react.umd.min.js" crossorigin></script>
  <script src="https://unpkg.com/@emotion/styled@11/dist/emotion-styled.umd.min.js" crossorigin></script>

  <!-- Material UI v5 -->
  <script src="https://unpkg.com/@mui/material@5.15.15/umd/material-ui.production.min.js" crossorigin></script>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

  <!-- Core Comparison Engine & Normalizer Services -->
  <script src="src/core/normalizer.js"></script>
  <script src="src/core/comparisonEngine.js"></script>
  <script src="src/services/excelService.js"></script>

  <!-- Compiled React App (Runs locally with zero CORS restrictions & zero build delay) -->
  <script src="src/react/App.js"></script>
</body>
</html>
